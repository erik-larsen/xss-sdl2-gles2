<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>xscreensaver</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  /* The canvas fills the window; the hack's own aspect is whatever
     size the driver requests (SDL resizes the backing store). */
  #canvas {
    display: block;
    width: 100vw; height: 100vh;
    border: 0; outline: none;
    background: #000;
    image-rendering: auto;
  }
  /* Minimal load veil; removed once the first frame is presented. */
  #veil {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #444;
    font: 14px/1.4 system-ui, sans-serif;
    transition: opacity .4s ease; z-index: 10;
  }
  #veil.hidden { opacity: 0; pointer-events: none; }

  /* Settings drawer (populated from options.json, generated by
     scripts/gen_options.py from the upstream config XMLs). */
  #gear {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid #2a2a3a; background: rgba(20,20,28,.8);
    color: #8a8a9a; font: 18px/34px system-ui, sans-serif;
    text-align: center; cursor: pointer; user-select: none;
    opacity: 0; transition: opacity .3s ease; display: none;
  }
  #gear.shown { opacity: 1; }
  #gear:hover { color: #6cf; border-color: #6cf; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: min(340px, 90vw); overflow-y: auto;
    background: rgba(14,14,20,.96); border-left: 1px solid #2a2a3a;
    color: #e8e8f0; font: 13px/1.5 system-ui, sans-serif;
    padding: 16px 18px 90px; box-sizing: border-box;
    transform: translateX(105%); transition: transform .25s ease;
  }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
  #panel .sub { color: #8a8a9a; font-size: 11px; margin: 0 0 14px; }
  #panel .ctl { margin: 12px 0; }
  #panel label.top { display: block; color: #b8b8c8; margin-bottom: 3px; }
  #panel .val { float: right; color: #6cf; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { width: 100%; accent-color: #6cf; }
  #panel .ends { display: flex; justify-content: space-between;
                 color: #66667a; font-size: 10px; margin-top: -2px; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel input[type=checkbox] { accent-color: #6cf; }
  #panel select, #panel input[type=text], #panel input[type=number] {
    width: 100%; background: #1a1a24; color: #e8e8f0;
    border: 1px solid #2a2a3a; border-radius: 6px; padding: 5px 8px;
    font: inherit; box-sizing: border-box;
  }
  #panel .btns {
    position: fixed; right: 0; bottom: 0; width: min(340px, 90vw);
    display: flex; gap: 8px; padding: 12px 18px;
    background: rgba(14,14,20,.96); border-top: 1px solid #2a2a3a;
    box-sizing: border-box;
  }
  #panel .btns button {
    flex: 1; padding: 8px 0; border-radius: 8px; cursor: pointer;
    font: inherit; border: 1px solid #2a2a3a;
    background: #1a1a24; color: #e8e8f0;
  }
  #panel .btns button.primary { background: #6cf; color: #000;
    border-color: #6cf; font-weight: 600; }
  #panel .close { position: absolute; top: 10px; right: 12px;
    background: none; border: 0; color: #8a8a9a; font-size: 20px;
    cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"
        oncontextmenu="event.preventDefault()"></canvas>
<div id="veil"><span id="veiltext">loading…</span></div>
<div id="gear" title="settings">&#9881;</div>
<div id="panel"></div>

<script>
  // The driver calls SDL_SetWindowTitle(); SDL routes that to
  // document.title, so the tab name becomes "xscreensaver: <hack>".
  var Module = {
    canvas: (function () { return document.getElementById('canvas'); })(),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      var v = document.getElementById('veiltext');
      if (v) v.textContent = t || 'loading…';
    },
    onRuntimeInitialized: function () {
      // Hide the veil shortly after the runtime starts; the first
      // frames are on their way.
      setTimeout(function () {
        var veil = document.getElementById('veil');
        if (veil) veil.classList.add('hidden');
      }, 300);
    }
  };
  window.onerror = function (msg) {
    var v = document.getElementById('veiltext');
    if (v) v.textContent = 'error — see console';
    console.error(msg);
  };

  // ---- settings drawer -------------------------------------------------
  (function () {
    var gear = document.getElementById('gear');
    var panel = document.getElementById('panel');
    var schema = null, widgets = [], owned = {};

    fetch('options.json').then(function (r) {
      if (!r.ok) throw 0; return r.json();
    }).then(function (s) {
      schema = s;
      gear.style.display = 'block';
    }).catch(function () {});

    // Current query args: key -> value (or true for bare flags).
    function queryArgs() {
      var m = {};
      location.search.slice(1).split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        if (i < 0) m[decodeURIComponent(kv)] = true;
        else m[decodeURIComponent(kv.slice(0, i))] =
               decodeURIComponent(kv.slice(i + 1).replace(/\+/g, '%20'));
      });
      return m;
    }

    function fmt(v) { return String(parseFloat(v.toPrecision(4))); }

    // slider <-> value mapping, honouring the XML convert= semantics:
    // "invert" mirrors the scale (frame-rate sliders driving delay);
    // "ratio" is geometric so the default sits mid-scale.
    function sliderToVal(c, p) {
      if (c.conv === 'ratio')
        return c.low * Math.pow(c.high / c.low, p / 1000);
      var v = c.low + (c.high - c.low) * p / 1000;
      if (c.conv === 'invert') v = c.low + c.high - v;
      return c.int ? Math.round(v) : v;
    }
    function valToSlider(c, v) {
      if (c.conv === 'ratio')
        return 1000 * Math.log(v / c.low) / Math.log(c.high / c.low);
      if (c.conv === 'invert') v = c.low + c.high - v;
      return 1000 * (v - c.low) / (c.high - c.low);
    }

    function build() {
      var qs = queryArgs();
      widgets = []; owned = {};
      panel.innerHTML = '';
      var h = document.createElement('h2');
      h.textContent = schema.label;
      var sub = document.createElement('p');
      sub.className = 'sub';
      sub.textContent = 'settings apply on reload';
      var x = document.createElement('button');
      x.className = 'close'; x.innerHTML = '&times;';
      x.onclick = close;
      panel.appendChild(x); panel.appendChild(h); panel.appendChild(sub);

      schema.controls.forEach(function (c) {
        var d = document.createElement('div');
        d.className = 'ctl';
        var w = { c: c };

        if (c.t === 'slider' || c.t === 'spin') {
          owned[c.key] = 1;
          var cur = c.def;
          if (qs[c.key] !== undefined && qs[c.key] !== true)
            cur = parseFloat(qs[c.key]) || c.def;
          var lab = document.createElement('label');
          lab.className = 'top'; lab.textContent = c.label;
          var val = document.createElement('span');
          val.className = 'val'; val.textContent = fmt(cur);
          lab.appendChild(val);
          d.appendChild(lab);
          var inp = document.createElement('input');
          if (c.t === 'slider') {
            inp.type = 'range'; inp.min = 0; inp.max = 1000; inp.step = 1;
            inp.value = valToSlider(c, cur);
            // the 1000-step grid rarely lands exactly on the default
            // (ratio sliders especially); snap that position to it so
            // an untouched slider round-trips to no arg at all
            var defPos = Math.round(valToSlider(c, c.def));
            var curVal = function () {
              return +inp.value === defPos ? c.def
                                           : sliderToVal(c, +inp.value);
            };
            inp.oninput = function () {
              val.textContent = fmt(curVal());
            };
            d.appendChild(inp);
            if (c.lowlab || c.highlab) {
              var ends = document.createElement('div');
              ends.className = 'ends';
              ends.innerHTML = '<span></span><span></span>';
              ends.children[0].textContent = c.lowlab || '';
              ends.children[1].textContent = c.highlab || '';
              d.appendChild(ends);
            }
            w.get = curVal;
          } else {
            inp.type = 'number';
            inp.min = c.low; inp.max = c.high;
            inp.step = c.int ? 1 : 'any';
            inp.value = cur;
            inp.oninput = function () { val.textContent = inp.value; };
            d.appendChild(inp);
            w.get = function () { return parseFloat(inp.value); };
          }
          w.emit = function (out) {
            var v = w.get();
            if (fmt(v) !== fmt(c.def)) out.push([c.key, fmt(v)]);
          };
        } else if (c.t === 'bool') {
          if (c.on) owned[c.on[0]] = 1;
          if (c.off) owned[c.off[0]] = 1;
          var on = !!c.def;
          if (c.on && qs[c.on[0]] !== undefined) on = true;
          if (c.off && qs[c.off[0]] !== undefined) on = false;
          var row = document.createElement('label');
          row.className = 'row';
          var cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = on;
          row.appendChild(cb);
          row.appendChild(document.createTextNode(c.label));
          d.appendChild(row);
          w.emit = function (out) {
            if (cb.checked && !c.def && c.on)
              out.push([c.on[0], c.on[1]]);
            if (!cb.checked && c.def && c.off)
              out.push([c.off[0], c.off[1]]);
          };
        } else if (c.t === 'sel') {
          c.opts.forEach(function (o) { if (o[1]) owned[o[1]] = 1; });
          if (c.label) {
            var sl = document.createElement('label');
            sl.className = 'top'; sl.textContent = c.label;
            d.appendChild(sl);
          }
          var sel = document.createElement('select');
          var chosen = -1;
          c.opts.forEach(function (o, i) {
            var op = document.createElement('option');
            op.value = i; op.textContent = o[0];
            sel.appendChild(op);
            if (chosen < 0 && !o[1]) chosen = i;   // the no-arg default
          });
          c.opts.forEach(function (o, i) {
            if (o[1] && qs[o[1]] !== undefined &&
                (o[2] === null || qs[o[1]] === o[2])) chosen = i;
          });
          if (chosen < 0) chosen = 0;
          sel.value = chosen;
          d.appendChild(sel);
          w.emit = function (out) {
            var o = c.opts[+sel.value];
            if (o[1]) out.push([o[1], o[2]]);
          };
        } else if (c.t === 'str') {
          owned[c.key] = 1;
          var tl = document.createElement('label');
          tl.className = 'top'; tl.textContent = c.label;
          d.appendChild(tl);
          var ti = document.createElement('input');
          ti.type = 'text';
          if (qs[c.key] !== undefined && qs[c.key] !== true)
            ti.value = qs[c.key];
          d.appendChild(ti);
          w.emit = function (out) {
            if (ti.value) out.push([c.key, ti.value]);
          };
        } else return;

        widgets.push(w);
        panel.appendChild(d);
      });

      var btns = document.createElement('div');
      btns.className = 'btns';
      var reset = document.createElement('button');
      reset.textContent = 'Reset';
      reset.onclick = function () { navigate([]); };
      var apply = document.createElement('button');
      apply.className = 'primary'; apply.textContent = 'Apply';
      apply.onclick = function () {
        var out = [];
        widgets.forEach(function (w) { w.emit(out); });
        navigate(out);
      };
      btns.appendChild(reset); btns.appendChild(apply);
      panel.appendChild(btns);
    }

    // Reload with the given [key, value|null] pairs, preserving any
    // query args the panel doesn't own (--frames, --width, ...).
    function navigate(pairs) {
      var qs = queryArgs(), parts = [];
      Object.keys(qs).forEach(function (k) {
        if (owned[k]) return;
        parts.push(qs[k] === true ? encodeURIComponent(k)
          : encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]));
      });
      pairs.forEach(function (p) {
        parts.push(p[1] === null || p[1] === undefined
          ? encodeURIComponent(p[0])
          : encodeURIComponent(p[0]) + '=' + encodeURIComponent(p[1]));
      });
      var url = location.pathname + (parts.length ? '?' + parts.join('&') : '');
      if (url === location.pathname + location.search) close();
      else location.href = url;
    }

    function open() { build(); panel.classList.add('open'); }
    function close() { panel.classList.remove('open'); }
    gear.onclick = function () {
      panel.classList.contains('open') ? close() : open();
    };

    // Keep typed keys away from SDL's document-level listeners (the
    // hack quits on Q/Esc); Esc inside the panel just closes it.
    ['keydown', 'keyup', 'keypress'].forEach(function (ev) {
      panel.addEventListener(ev, function (e) {
        if (ev === 'keydown' && e.key === 'Escape') close();
        e.stopPropagation();
      });
    });

    // Esc leaves the hack page: back if there is history, else the
    // gallery index. Captured before SDL's handlers so the wasm side
    // never sees it (Q still freezes the hack in place).
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || panel.contains(e.target)) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (history.length > 1) history.back();
      else location.href = '../index.html';
    }, true);

    // The gear only appears while the pointer is moving (screensaver!).
    var fade = null;
    window.addEventListener('mousemove', function () {
      gear.classList.add('shown');
      clearTimeout(fade);
      fade = setTimeout(function () {
        if (!panel.classList.contains('open'))
          gear.classList.remove('shown');
      }, 2500);
    });
  })();
</script>
<!-- coi-serviceworker is intentionally NOT included: this build is
     single-threaded (no pthreads), so it needs no COOP/COEP headers
     and hosts from any static server, including GitHub Pages. -->
{{{ SCRIPT }}}
</body>
</html>
